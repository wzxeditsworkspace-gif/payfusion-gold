<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inscription | PayFusion Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* CSS IDENTIQUE AU LOGIN POUR COHÉRENCE TOTALE */
        :root {
            --gold-metallic: linear-gradient(135deg, #8A6623 0%, #D4AF37 25%, #F7EF8A 50%, #D4AF37 75%, #8A6623 100%);
            --gold-mid: #D4AF37;
            --black-pure: #000000;
            --black-surface: #0A0A0A;
            --border-color: #1A1A1A;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--black-pure); color: #FFF; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }

        .auth-card { width: 100%; max-width: 450px; background: var(--black-surface); border: 1px solid var(--border-color); padding: 50px; position: relative; }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--gold-metallic); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #666; margin-bottom: 8px; }
        
        .auth-input { width: 100%; padding: 14px 15px; background: #000; border: 1px solid var(--border-color); color: #FFF; font-size: 14px; transition: var(--transition); }
        .auth-input:focus { border-color: var(--gold-mid); }

        .btn-submit { width: 100%; padding: 16px; background: var(--gold-metallic); color: #000; border: none; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        
        .auth-footer { text-align: center; margin-top: 25px; }
        .auth-footer a { color: var(--gold-mid); text-decoration: none; font-size: 12px; }

        #error-msg { color: #FF3333; font-size: 12px; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div style="text-align:center; margin-bottom:30px;">
            <span style="font-size:24px; font-weight:900; background: var(--gold-metallic); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">INSCRIPTION</span>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label>Nom Complet</label>
                <input type="text" id="fullname" class="auth-input" placeholder="Ex: Jean Paul" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="auth-input" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" class="auth-input" placeholder="6 caractères min." required>
            </div>

            <button type="submit" class="btn-submit" id="btnText">Créer mon compte</button>
            <p id="error-msg"></p>
        </form>

        <div class="auth-footer">
            <a href="login.html">Déjà client ? Se connecter</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZn3ofujSzGlutB7ZDGiNestHEzV7J0_8",
            authDomain: "payfusion-gold.firebaseapp.com",
            projectId: "payfusion-gold",
            storageBucket: "payfusion-gold.firebasestorage.app",
            messagingSenderId: "843759388438",
            appId: "1:843759388438:web:019918e40d6e920d96f237"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const registerForm = document.getElementById('registerForm');
        const errorMsg = document.getElementById('error-msg');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullname = document.getElementById('fullname').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // INITIALISATION DU SOLDE DANS FIRESTORE
                await setDoc(doc(db, "users", user.uid), {
                    name: fullname,
                    email: email,
                    balanceHTG: 0,
                    balanceUSD: 0,
                    balanceUSDT: 0,
                    role: "user",
                    createdAt: new Date()
                });

                window.location.href = "home.html";
            } catch (error) {
                errorMsg.innerText = "Erreur : Email invalide ou déjà utilisé.";
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
