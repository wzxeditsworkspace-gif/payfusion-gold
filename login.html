<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhésion Gold | PayFusion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* CSS IDENTIQUE POUR UNITÉ VISUELLE */
        :root {
            --gold-metallic: linear-gradient(135deg, #8A6623 0%, #BF953F 20%, #FCF6BA 45%, #FBF5B7 50%, #D4AF37 55%, #AA771C 85%, #8A6623 100%);
            --gold-solid: #D4AF37; --black-absolute: #000; --black-elevated: #080808; --border-luxe: #151515;
            --shadow-inset: inset 2px 2px 10px rgba(0,0,0,0.9);
            --header-h: 100px; --sidebar-w: 320px; --transition: all 0.5s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--black-absolute); color: #FFF; font-family: 'Inter', sans-serif; }

        header { height: var(--header-h); background: rgba(0,0,0,0.95); border-bottom: 1px solid var(--border-luxe); position: fixed; top: 0; width: 100%; z-index: 5000; display: flex; align-items: center; }
        .header-inner { display: grid; grid-template-columns: 1fr auto 1fr; width: 100%; align-items: center; padding: 0 40px; }
        .menu-trigger { font-size: 11px; text-transform: uppercase; color: var(--gold-solid); cursor: pointer; font-weight: 800; letter-spacing: 3px; }
        .home-icon-btn { width: 45px; height: 45px; border: 1px solid var(--border-luxe); color: var(--gold-solid); display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.3s; }
        .home-icon-btn:hover { border-color: var(--gold-solid); }

        #mainSidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; background: #050505; border-right: 1px solid var(--border-luxe); transform: translateX(-105%); transition: var(--transition); z-index: 6000; padding: 50px 40px; }
        #mainSidebar.active { transform: translateX(0); }
        .nav-link { text-decoration: none; color: #444; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
        #pageOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 5500; }

        .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 120px 20px 60px; }
        .auth-card { width: 100%; max-width: 500px; background: var(--black-elevated); padding: 50px; border: 1px solid var(--border-luxe); position: relative; box-shadow: 0 50px 100px rgba(0,0,0,0.9); }
        .auth-card::before { content:''; position:absolute; top:0; left:0; width:100%; height:2px; background: var(--gold-metallic); }

        .form-group { margin-bottom: 25px; }
        .form-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #444; margin-bottom: 10px; font-weight: 800; }
        .input-box { display: flex; align-items: center; background: #000; border: 1px solid var(--border-luxe); box-shadow: var(--shadow-inset); transition: 0.4s; }
        .icon-box { width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border-luxe); color: #333; }
        input { flex: 1; height: 55px; background: transparent; border: none; padding: 0 20px; color: #fff; font-size: 14px; font-weight: 600; }
        .input-box:focus-within { border-color: var(--gold-solid); }

        .btn-auth { width: 100%; padding: 20px; background: var(--gold-metallic); color: #000; border: none; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .btn-auth:hover { transform: translateY(-3px); filter: brightness(1.2); }
        .auth-footer { text-align: center; margin-top: 30px; font-size: 11px; color: #444; text-transform: uppercase; }
        .auth-footer a { color: var(--gold-solid); text-decoration: none; font-weight: 800; }
    </style>
</head>
<body>
    <div id="pageOverlay" onclick="closeMenu()"></div>
    <aside id="mainSidebar">
        <div class="menu-trigger" onclick="closeMenu()"><i class="fas fa-times"></i> FERMER</div>
        <ul class="sidebar-nav">
            <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Accueil</a></li>
            <li class="nav-item"><a href="login.html" class="nav-link"><i class="fas fa-lock"></i> Connexion</a></li>
        </ul>
    </aside>

    <header>
        <div class="header-inner">
            <div class="menu-trigger" onclick="openMenu()"><i class="fas fa-bars"></i> MENU</div>
            <div class="logo-box" onclick="location.href='index.html'"><span style="background:var(--gold-metallic); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:900; letter-spacing:5px; font-size:22px;">PAYFUSION</span></div>
            <div class="header-actions"><a href="index.html" class="home-icon-btn"><i class="fas fa-home"></i></a></div>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align:center; margin-bottom:40px;"><h2 style="font-size:18px; font-weight:900; letter-spacing:5px; color:var(--gold-solid); text-transform:uppercase;">Adhésion</h2></div>
            <form id="regForm">
                <div class="form-group">
                    <label class="form-label">Nom Complet</label>
                    <div class="input-box"><div class="icon-box"><i class="fas fa-user-shield"></i></div><input type="text" id="name" required placeholder="Jean Paul"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Adresse Email</label>
                    <div class="input-box"><div class="icon-box"><i class="fas fa-at"></i></div><input type="email" id="email" required placeholder="votre@email.com"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Code Secret</label>
                    <div class="input-box"><div class="icon-box"><i class="fas fa-key"></i></div><input type="password" id="pass" required placeholder="••••••••"></div>
                </div>
                <button type="submit" class="btn-auth" id="btnR">Créer mon compte Gold</button>
            </form>
            <div class="auth-footer">Déjà membre ? <a href="login.html">Se connecter</a></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZn3ofujSzGlutB7ZDGiNestHEzV7J0_8",
            authDomain: "payfusion-gold.firebaseapp.com",
            projectId: "payfusion-gold",
            storageBucket: "payfusion-gold.firebasestorage.app",
            messagingSenderId: "843759388438",
            appId: "1:843759388438:web:019918e40d6e920d96f237"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.openMenu = () => { document.getElementById('mainSidebar').classList.add('active'); document.getElementById('pageOverlay').style.display='block'; };
        window.closeMenu = () => { document.getElementById('mainSidebar').classList.remove('active'); document.getElementById('pageOverlay').style.display='none'; };

        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnR');
            btn.innerText = "CRÉATION EN COURS...";
            try {
                const cred = await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
                await setDoc(doc(db, "users", cred.user.uid), {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    balanceHTG: 0, balanceUSD: 0, balanceUSDT: 0, role: "user", createdAt: new Date()
                });
                location.href = "home.html";
            } catch (err) {
                alert("Erreur lors de l'inscription.");
                btn.innerText = "CRÉER MON COMPTE GOLD";
            }
        };
    </script>
</body>
</html>
