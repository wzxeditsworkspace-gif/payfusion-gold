<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="author" content="WzX Editor">
    <title>Paiement Sécurisé | PayFusion Gold</title>

    <!-- TYPOGRAPHIE : INTER -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 
           ================================================================
           PAYFUSION PAYMENT ARCHITECTURE - LUXE V9.0
           DÉVELOPPÉ POUR : WzX EDITOR (15 ANS, HAÏTI)
           DESIGN : NOIR PUR & GOLD MÉTALLIQUE SPÉCULAIRE
           ================================================================
        */

        :root {
            --gold-specular: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            --gold-solid: #D4AF37;
            --black-pure: #000000;
            --black-surface: #050505;
            --black-card: #0A0A0A;
            --border-luxe: #1A1A1A;
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --success: #00FF66;
            --error: #FF3333;
            --transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* RESET ET STRUCTURE */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--black-pure); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }

        .checkout-wrapper {
            width: 100%; max-width: 500px; padding: 20px;
        }

        /* CARTE DE PAIEMENT LUXE */
        .payment-card {
            background: var(--black-surface); border: 1px solid var(--border-luxe);
            padding: 50px; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .payment-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--gold-specular);
        }

        /* LOGO ARCHITECTURE */
        .brand-zone { text-align: center; margin-bottom: 40px; }
        .brand-text { font-weight: 900; letter-spacing: 5px; font-size: 22px; background: var(--gold-specular); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }

        /* RÉCAPITULATIF (ORDRE ABSOLU) */
        .invoice-section { margin-bottom: 40px; }
        .invoice-title { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--gold-solid); margin-bottom: 25px; text-align: center; font-weight: 800; }
        
        .invoice-row {
            display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #111; font-size: 13px;
        }
        .invoice-row span:first-child { color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .invoice-row span:last-child { font-weight: 700; color: #FFF; }

        .total-box {
            margin-top: 20px; padding: 25px; background: var(--black-card); border: 1px solid var(--gold-solid); text-align: center;
        }
        .total-box p { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 5px; }
        .total-box h2 { font-size: 32px; font-weight: 900; color: var(--gold-solid); }

        /* ÉTAT DU PORTEFEUILLE */
        .balance-status {
            margin: 30px 0; padding: 15px; border: 1px dashed #333; text-align: center; font-size: 11px; color: var(--text-dim);
        }
        .balance-status strong { color: var(--success); }

        /* ACTIONS */
        .btn-pay {
            width: 100%; padding: 20px; background: var(--gold-specular); color: #000; border: none;
            font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: var(--transition);
        }
        .btn-pay:hover { filter: brightness(1.2); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); }
        .btn-pay:disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }

        .btn-back { display: block; text-align: center; margin-top: 25px; text-decoration: none; color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        .btn-back:hover { color: var(--gold-solid); }

        /* WHATSAPP FLOAT */
        .wa-float { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 30px; z-index: 2000; }

        /* ANIMATIONS COORDINATION */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .anim { animation: fadeIn 0.8s ease forwards; }

    </style>
</head>
<body>

    <div class="checkout-wrapper anim">
        <div class="payment-card">
            <div class="brand-zone">
                <span class="brand-text">PayFusion</span>
            </div>

            <div class="invoice-section">
                <h2 class="invoice-title">Facturation de prestige</h2>
                
                <div id="invoiceContent">
                    <div class="invoice-row">
                        <span>Service</span>
                        <span id="serviceName">Chargement...</span>
                    </div>
                    <div class="invoice-row">
                        <span>Détails</span>
                        <span id="serviceDetail">---</span>
                    </div>
                    <div class="invoice-row">
                        <span>Compte Cible</span>
                        <span id="targetAccount" style="color:var(--gold-solid)">---</span>
                    </div>
                </div>

                <div class="total-box">
                    <p>Montant net à débiter</p>
                    <h2 id="finalAmount">0 HTG</h2>
                </div>
            </div>

            <div class="balance-status">
                Votre solde disponible : <strong id="userCurrentBalance">0.00 HTG</strong>
            </div>

            <button class="btn-pay" id="confirmPaymentBtn" onclick="processOrder()">Confirmer le paiement</button>
            <a href="home.html" class="btn-back">Annuler et retourner au coffre</a>
        </div>
    </div>

    <!-- WHATSAPP -->
    <a href="https://wa.me/50939442808" target="_blank" class="wa-float"><i class="fab fa-whatsapp"></i></a>

    <!-- MOTEUR DE PAIEMENT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZn3ofujSzGlutB7ZDGiNestHEzV7J0_8",
            authDomain: "payfusion-gold.firebaseapp.com",
            projectId: "payfusion-gold",
            storageBucket: "payfusion-gold.firebasestorage.app",
            messagingSenderId: "843759388438",
            appId: "1:843759388438:web:019918e40d6e920d96f237"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentBalance = 0;

        // RÉCUPÉRATION DES DONNÉES DE LA COMMANDE (Simulées ou via LocalStorage)
        // Note : Dans un flux pro, on passe les infos via localStorage après le clic sur Services/FreeFire
        const orderInfo = JSON.parse(localStorage.getItem('pendingOrder')) || {
            service: "Service Gold",
            detail: "Abonnement Premium",
            target: "Non spécifié",
            amount: 0
        };

        // INITIALISATION
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Remplir l'UI
                document.getElementById('serviceName').innerText = orderInfo.service;
                document.getElementById('serviceDetail').innerText = orderInfo.detail;
                document.getElementById('targetAccount').innerText = orderInfo.target;
                document.getElementById('finalAmount').innerText = orderInfo.amount.toLocaleString() + " HTG";

                // Écouter le solde
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        currentBalance = docSnap.data().balanceHTG;
                        document.getElementById('userCurrentBalance').innerText = currentBalance.toLocaleString() + " HTG";
                        
                        // Bloquer si solde insuffisant
                        if (currentBalance < orderInfo.amount) {
                            const btn = document.getElementById('confirmPaymentBtn');
                            btn.disabled = true;
                            btn.innerText = "SOLDE INSUFFISANT";
                            btn.style.background = "#222";
                            btn.style.color = "#444";
                        }
                    }
                });
            } else { window.location.href = "login.html"; }
        });

        // ACTION DE PAIEMENT RÉEL
        window.processOrder = async () => {
            if (currentBalance < orderInfo.amount) return;

            try {
                const btn = document.getElementById('confirmPaymentBtn');
                btn.innerText = "TRANSACTION EN COURS...";
                btn.disabled = true;

                // 1. Débiter l'utilisateur
                await updateDoc(doc(db, "users", currentUser.uid), {
                    balanceHTG: increment(-orderInfo.amount)
                });

                // 2. Créer la commande pour l'admin
                await addDoc(collection(db, "orders"), {
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    service: orderInfo.service,
                    detail: orderInfo.detail,
                    target: orderInfo.target,
                    amountHTG: orderInfo.amount,
                    status: "pending",
                    date: new Date()
                });

                // 3. Notification de succès
                alert("Paiement validé avec succès ! Votre commande est en cours de traitement.");
                localStorage.removeItem('pendingOrder');
                window.location.href = "home.html";

            } catch (e) {
                alert("Erreur critique lors du paiement. Veuillez contacter le support.");
                window.location.reload();
            }
        };

        console.log("PayFusion Gateway Core Initialized.");
    </script>
</body>
</html>
