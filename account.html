<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paramètres | PayFusion Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 
           ================================================================
           PAYFUSION SETTINGS MASTER V10.0
           DÉVELOPPÉ PAR : WzX EDITOR
           ================================================================
        */

        :root {
            --gold-metallic: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            --gold-solid: #D4AF37;
            --black-pure: #000000;
            --black-surface: #050505;
            --border-luxe: #1A1A1A;
            --text-main: #FFFFFF;
            --text-dim: #666666;
            --sidebar-w: 280px;
            --header-h: 90px;
        }

        * { margin:0; padding:0; box-sizing:border-box; outline:none; -webkit-font-smoothing:antialiased; }
        body { background: var(--black-pure); color: #fff; font-family: 'Inter', sans-serif; display: flex; }

        /* SIDEBAR IDENTIQUE */
        aside {
            width: var(--sidebar-w); height: 100vh; background: var(--black-surface);
            border-right: 1px solid var(--border-luxe); position: fixed; left: 0; top: 0;
        }
        .sidebar-brand { height: var(--header-h); border-bottom: 1px solid var(--border-luxe); display: flex; align-items: center; justify-content: center; }
        .nav-list { list-style: none; padding: 40px 20px; }
        .nav-link { display: flex; align-items: center; padding: 15px 20px; text-decoration: none; color: var(--text-dim); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; transition: 0.4s; }
        .nav-link:hover, .nav-link.active { background: var(--gold-metallic); color: #000; font-weight: 800; }
        .nav-link i { width: 30px; }

        /* MAIN CONTENT */
        main { margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w)); padding: 120px 50px 50px; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

        .config-card {
            background: #080808; border: 1px solid var(--border-luxe); padding: 50px;
            position: relative; overflow: hidden;
        }
        .config-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--gold-metallic); }

        .card-title { font-size: 14px; text-transform: uppercase; letter-spacing: 3px; color: var(--gold-solid); margin-bottom: 40px; font-weight: 800; }

        .input-group { margin-bottom: 30px; }
        .input-group label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .custom-input {
            width: 100%; padding: 16px; background: #000; border: 1px solid var(--border-luxe);
            color: #FFF; font-weight: 700; font-size: 14px; transition: 0.3s;
        }
        .custom-input:focus { border-color: var(--gold-solid); }

        .btn-save {
            width: 100%; padding: 20px; background: var(--gold-metallic); color: #000;
            border: none; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; font-size: 11px;
        }
        .btn-save:hover { filter: brightness(1.2); transform: translateY(-3px); }

        @media (max-width: 1100px) {
            aside { display: none; }
            main { margin-left: 0; width: 100%; padding: 100px 20px; }
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-brand">
            <span style="background: var(--gold-metallic); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; letter-spacing: 3px; font-size: 18px;">PAYFUSION</span>
        </div>
        <ul class="nav-list">
            <li><a href="home.html" class="nav-link"><i class="fas fa-columns"></i> Dashboard</a></li>
            <li><a href="account.html" class="nav-link"><i class="fas fa-id-card"></i> Mon Compte</a></li>
            <li><a href="settings.html" class="nav-link active"><i class="fas fa-shield-alt"></i> Paramètres</a></li>
            <li><a href="logout.html" class="nav-link" style="color: #ff3333;"><i class="fas fa-power-off"></i> Déconnexion</a></li>
        </ul>
    </aside>

    <main>
        <div class="settings-grid">
            <!-- IDENTITÉ -->
            <div class="config-card">
                <h2 class="card-title">Profil Public</h2>
                <div class="input-group">
                    <label>Nom complet</label>
                    <input type="text" id="editName" class="custom-input">
                </div>
                <div class="input-group">
                    <label>Email (Non modifiable)</label>
                    <input type="text" id="displayEmail" class="custom-input" disabled style="opacity: 0.4;">
                </div>
                <button class="btn-save" onclick="updateInfo()">Mettre à jour le profil</button>
            </div>

            <!-- SÉCURITÉ -->
            <div class="config-card">
                <h2 class="card-title">Sécurité Mot de Passe</h2>
                <div class="input-group">
                    <label>Nouveau mot de passe</label>
                    <input type="password" id="newPass" class="custom-input" placeholder="••••••••">
                </div>
                <div class="input-group">
                    <label>Confirmer mot de passe</label>
                    <input type="password" id="confirmPass" class="custom-input" placeholder="••••••••">
                </div>
                <button class="btn-save" onclick="changePass()">Sécuriser le compte</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZn3ofujSzGlutB7ZDGiNestHEzV7J0_8",
            authDomain: "payfusion-gold.firebaseapp.com",
            projectId: "payfusion-gold",
            storageBucket: "payfusion-gold.firebasestorage.app",
            messagingSenderId: "843759388438",
            appId: "1:843759388438:web:019918e40d6e920d96f237"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const d = docSnap.data();
                        document.getElementById('editName').value = d.name;
                        document.getElementById('displayEmail').value = d.email;
                    }
                });
            } else { window.location.href = "login.html"; }
        });

        window.updateInfo = async () => {
            const n = document.getElementById('editName').value;
            if(!n) return;
            try {
                await updateDoc(doc(db, "users", currentUser.uid), { name: n });
                alert("Profil mis à jour !");
            } catch (e) { alert("Erreur."); }
        };

        window.changePass = async () => {
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            if(p1 !== p2) return alert("Mots de passe différents.");
            try {
                await updatePassword(currentUser, p1);
                alert("Mot de passe mis à jour !");
            } catch (e) { alert("Veuillez vous reconnecter pour cette action de sécurité."); }
        };
    </script>
</body>
</html>"
