<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Succès | PayFusion Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: linear-gradient(135deg, #BF953F 0%, #FCF6BA 50%, #AA771C 100%); }
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; margin: 0; }
        .success-card { padding: 60px; border: 1px solid #111; position: relative; max-width: 400px; }
        .success-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--gold); }
        .icon-circle { width: 80px; height: 80px; border: 2px solid #D4AF37; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; color: #D4AF37; font-size: 35px; box-shadow: 0 0 20px rgba(212,175,55,0.2); }
        h1 { font-size: 14px; letter-spacing: 5px; text-transform: uppercase; color: #D4AF37; margin-bottom: 20px; }
        p { font-size: 12px; color: #666; line-height: 1.6; margin-bottom: 30px; }
        .btn-home { padding: 15px 30px; background: var(--gold); color: #000; text-decoration: none; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-circle"><i class="fas fa-check"></i></div>
        <h1>Ordre Confirmé</h1>
        <p>Votre demande a été enregistrée avec succès. Notre équipe traite actuellement votre commande. Merci de votre confiance.</p>
        <a href="home.html" class="btn-home">Retour au Dashboard</a>
    </div>
</body>
</html>
